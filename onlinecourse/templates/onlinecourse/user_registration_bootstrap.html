<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | OnlineCourse</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 480px;">
        <div class="card shadow p-4">
            <h3 class="text-center font-weight-bold mb-4">Register Learner Account</h3>
            <form action="{% url 'onlinecourse:registration' %}" method="post">
                {% csrf_token %}
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>First Name</label>
                        <input type="text" name="first_name" class="form-control" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label>Last Name</label>
                        <input type="text" name="last_name" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="psw" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success btn-block">Sign Up</button>
                <div class="text-center mt-3">
                    <a href="{% url 'onlinecourse:login' %}">Already have an account? Login</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
