<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | OnlineCourse</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 420px;">
        <div class="card shadow p-4">
            <h3 class="text-center font-weight-bold mb-4">Login</h3>
            <form action="{% url 'onlinecourse:login' %}" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="psw" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
                <div class="text-center mt-3">
                    <a href="{% url 'onlinecourse:registration' %}">Don't have an account? Sign Up</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
